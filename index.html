<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Be My Valentine 💖</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ffd6e8, #ffffff);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 90%;
        }

        .dog {
            width: 180px;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff4d88;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background: #ff4d88;
            color: white;
            font-weight: bold;
            transform: scale(1);
        }

        #yesBtn:hover {
            background: #ff2f73;
        }

        #noBtn {
            background: #ddd;
            color: #333;
        }

        #noBtn:hover {
            background: #ccc;
        }

        .message {
            margin-top: 25px;
            font-size: 22px;
            color: #ff4d88;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Cute Dog Image -->
    <img 
        src="https://i.imgur.com/3Wb8R9x.png" 
        alt="Cute Dog"
        class="dog"
    >

    <h1>Ashu bache will you be my Valentine? 💘</h1>

    <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 😢</button>
    </div>

    <div class="message" id="message">
        Yayyy! I love you sooo much! 🥰💞<br>
        Happy Valentine’s Day ❤️
    </div>

</div>

<script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    let yesSize = 1;
    let noClicks = 0;

    noBtn.addEventListener("click", () => {
        noClicks++;

        // Increase Yes button size
        yesSize += 0.3;
        yesBtn.style.transform = `scale(${yesSize})`;

        // Move No button randomly
        const x = Math.random() * 200 - 100;
        const y = Math.random() * 200 - 100;

        noBtn.style.transform = `translate(${x}px, ${y}px)`;

        // Hide No button after few clicks
        if (noClicks >= 6) {
            noBtn.style.display = "none";
        }
    });

    yesBtn.addEventListener("click", () => {
        message.style.display = "block";
        yesBtn.style.display = "none";
        noBtn.style.display = "none";
    });
</script>

</body>
</html>
